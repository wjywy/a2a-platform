apiVersion: v1
kind: Secret
metadata:
  name: {{ include "a2a-platform.fullname" . }}
  labels:
    {{- include "a2a-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_URL: {{ required "external.postgresUrl is required" .Values.external.postgresUrl | quote }}
  REDIS_URL: {{ required "external.redisUrl is required" .Values.external.redisUrl | quote }}
  PLATFORM_JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  CREDENTIAL_ENCRYPTION_KEY: {{ required "secrets.credentialEncryptionKey is required" .Values.secrets.credentialEncryptionKey | quote }}
  CREDENTIAL_KEY_VERSION: {{ .Values.secrets.credentialKeyVersion | quote }}
  CREDENTIAL_PREVIOUS_KEYS: {{ .Values.secrets.credentialPreviousKeys | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  SMTP_URL: {{ .Values.secrets.smtpUrl | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
