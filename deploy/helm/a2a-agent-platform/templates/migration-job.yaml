apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "a2a-platform.fullname" . }}-migrate-{{ .Release.Revision }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["npm", "--workspace", "@a2a-platform/api", "run", "migrate"]
          envFrom:
            - secretRef: { name: {{ include "a2a-platform.fullname" . }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
