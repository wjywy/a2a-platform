apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "a2a-platform.fullname" . }}-worker
  labels:
    {{- include "a2a-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "a2a-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "a2a-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: migrate
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          command: ["npm", "--workspace", "@a2a-platform/api", "run", "migrate"]
          envFrom:
            - secretRef: { name: {{ include "a2a-platform.fullname" . }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: worker
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          command: ["npm", "--workspace", "@a2a-platform/health-worker", "run", "start"]
          envFrom:
            - configMapRef: { name: {{ include "a2a-platform.fullname" . }} }
            - secretRef: { name: {{ include "a2a-platform.fullname" . }} }
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
            runAsUser: 10001
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
