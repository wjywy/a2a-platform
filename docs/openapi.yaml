  /v1/agents/{slug}:
    get:
      tags: [A2A Gateway]
      operationId: externalAgentDetail
      security: [{ TenantApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
      responses: { "200": { description: API-Key-visible Agent metadata } }
  /agents/{slug}/a2a/rest/extendedAgentCard:
    get:
      tags: [A2A Gateway]
      operationId: extendedAgentCard
      security: [{ TenantApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
