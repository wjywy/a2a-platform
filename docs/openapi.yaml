openapi: 3.1.0
info:
  title: A2A Agent Platform API
  version: 0.1.0
  description: |
    Multi-tenant management and external A2A gateway API. Management endpoints use
    a console access token. Gateway endpoints use a tenant API Key. Protocol payloads
    follow A2A Protocol v1.0 and are intentionally represented as open JSON schemas here.
servers:
  - url: http://localhost:8080
    description: Local Docker Compose gateway
security: []
tags:
  - { name: Authentication }
  - { name: Tenants }
  - { name: Agents }
  - { name: API Keys }
  - { name: Tasks }
  - { name: Usage }
  - { name: Webhooks }
  - { name: Alerts }
  - { name: Notifications }
  - { name: A2A Gateway }
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200": { description: Process is alive }
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          { description: "Database, Redis, migrations, and Worker are ready" }
        "503": { description: A required dependency is not ready }
  /api/auth/config:
    get:
      tags: [Authentication]
      operationId: authConfig
      responses:
        "200":
          description: Enabled sign-in methods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Error" }
  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: selfRegister
      description: Creates an unprivileged customer account and immediately starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email: { type: string, format: email }
                displayName: { type: string, minLength: 2, maxLength: 100 }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "201": { $ref: "#/components/responses/AuthSession" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      description: Rotates the HttpOnly refresh cookie and returns a short-lived access token.
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "401": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security: [{ ConsoleToken: [] }]
      responses:
        "204": { description: Session revoked }
  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: currentUser
      security: [{ ConsoleToken: [] }]
      responses:
        "200":
          description: User profile and tenant memberships
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tenants:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Tenant" },
                    }
  /api/auth/invitations/{token}:
    get:
      tags: [Authentication]
      operationId: inspectInvitation
      parameters: [{ $ref: "#/components/parameters/InvitationToken" }]
      responses:
        "200": { description: Valid invitation metadata }
        "410": { $ref: "#/components/responses/Error" }
  /api/auth/invitations/{token}/activate:
    post:
      tags: [Authentication]
      operationId: activateInvitation
      parameters: [{ $ref: "#/components/parameters/InvitationToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName, password]
              properties:
                displayName: { type: string, minLength: 1 }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "200": { $ref: "#/components/responses/AuthSession" }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/tenants:
    get:
      tags: [Tenants]
      operationId: listTenants
      security: [{ ConsoleToken: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Page" },
          { $ref: "#/components/parameters/PageSize" },
        ]
      responses:
        "200": { description: Paginated tenants }
    post:
      tags: [Tenants]
      operationId: createTenant
      security: [{ ConsoleToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantInput" }
      responses:
        "201": { description: Tenant created }
        "403": { $ref: "#/components/responses/Error" }
  /api/admin/tenants/{tenantId}:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [Tenants]
      operationId: getTenant
      security: [{ ConsoleToken: [] }]
      responses:
        "200": { description: Tenant detail }
    patch:
      tags: [Tenants]
      operationId: updateTenant
      security: [{ ConsoleToken: [] }]
      requestBody:
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/TenantInput" } },
          }
      responses:
        "200": { description: Updated tenant }
        "403": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Tenants]
      operationId: deleteTenant
      security: [{ ConsoleToken: [] }]
      responses:
        "204": { description: Tenant deleted }
        "409": { $ref: "#/components/responses/Error" }
  /api/admin/tenants/{tenantId}/members:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [Tenants]
      operationId: listMembers
      security: [{ ConsoleToken: [] }]
      responses:
        "200": { description: Tenant members }
  /api/admin/tenants/{tenantId}/members/invite:
    post:
      tags: [Tenants]
      operationId: inviteMember
      security: [{ ConsoleToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TenantId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                displayName: { type: string }
                role: { $ref: "#/components/schemas/TenantRole" }
      responses:
        "201": { description: Invitation; token is returned once }
  /api/admin/tenants/{tenantId}/api-keys:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [API Keys]
      operationId: listApiKeys
      security: [{ ConsoleToken: [] }]
      responses:
        "200": { description: API keys without plaintext secrets }
    post:
      tags: [API Keys]
      operationId: createApiKey
      security: [{ ConsoleToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyInput" }
      responses:
        "201": { description: API Key; plaintext secret is returned once }
  /api/admin/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      security: [{ ConsoleToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200": { description: Visible logical Agents }
    post:
      tags: [Agents]
      operationId: registerAgent
      security: [{ ConsoleToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInput" }
      responses:
        "201": { description: Card validated and Agent registered offline }
        "422": { $ref: "#/components/responses/Error" }
  /api/admin/agents/{slug}/instances:
    parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
    get:
      tags: [Agents]
      operationId: listAgentInstances
      security: [{ ConsoleToken: [] }]
      responses:
        "200": { description: Backends for a logical Agent }
    post:
      tags: [Agents]
      operationId: createAgentInstance
      security: [{ ConsoleToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInstanceInput" }
      responses:
        "201":
          { description: Instance created with encrypted upstream credentials }
  /api/admin/tasks:
    get:
      tags: [Tasks]
      operationId: searchTasks
      security: [{ ConsoleToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: agentId, in: query, schema: { type: string, format: uuid } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200": { description: Paginated task snapshots }
  /api/admin/tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTaskDetail
      security: [{ ConsoleToken: [] }]
      parameters:
        [{ name: taskId, in: path, required: true, schema: { type: integer } }]
      responses:
        "200":
          {
            description: "Request, artifacts, state snapshot and event timeline",
          }
  /api/admin/usage:
    get:
      tags: [Usage]
      operationId: searchUsage
      security: [{ ConsoleToken: [] }]
      responses:
        "200": { description: Paginated usage records }
  /api/admin/usage/summary:
    get:
      tags: [Usage]
      operationId: usageSummary
      security: [{ ConsoleToken: [] }]
      responses:
        "200":
          { description: "Request count, failure rate, p95 latency and trend" }
  /api/admin/notifications:
    get:
      tags: [Notifications]
      operationId: searchNotifications
      security: [{ ConsoleToken: [] }]
      responses:
        "200":
          {
            description: "Durable console, webhook and email notification records",
          }
  /api/admin/events:
    get:
      tags: [Notifications]
      operationId: subscribePlatformEvents
      security: [{ ConsoleToken: [] }]
      description: Cross-instance Server-Sent Event feed, optionally restricted to a readable tenant.
      responses:
        "200":
          {
            description: Platform SSE event stream,
            content: { text/event-stream: { schema: { type: string } } },
          }
  /api/admin/users:
    get:
      tags: [Authentication]
      operationId: listPlatformUsers
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Platform users } }
    post:
      tags: [Authentication]
      operationId: createPlatformUser
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "201": { description: Platform user created },
          "403": { $ref: "#/components/responses/Error" },
        }
  /api/admin/users/{userId}/status:
    post:
      tags: [Authentication]
      operationId: changePlatformUserStatus
      security: [{ ConsoleToken: [] }]
      parameters:
        [
          {
            name: userId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200": { description: User enabled or disabled },
          "403": { $ref: "#/components/responses/Error" },
        }
  /api/admin/tenants/{tenantId}/status:
    post:
      tags: [Tenants]
      operationId: changeTenantStatus
      security: [{ ConsoleToken: [] }]
      parameters: [{ $ref: "#/components/parameters/TenantId" }]
      responses: { "200": { description: Tenant activated or suspended } }
  /api/admin/tenants/{tenantId}/members/{memberId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - {
          name: memberId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      tags: [Tenants]
      operationId: updateTenantMember
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200": { description: Member role or status updated },
          "409": { $ref: "#/components/responses/Error" },
        }
    delete:
      tags: [Tenants]
      operationId: removeTenantMember
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "204": { description: Member removed },
          "409": { $ref: "#/components/responses/Error" },
        }
  /api/admin/tenants/{tenantId}/api-keys/{keyId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - {
          name: keyId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      tags: [API Keys]
      operationId: getApiKey
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            {
              description: "API key metadata and Agent grants, never plaintext",
            },
        }
    patch:
      tags: [API Keys]
      operationId: updateApiKey
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            {
              description: "API key metadata, quotas, scopes and grants updated",
            },
        }
  /api/admin/tenants/{tenantId}/api-keys/{keyId}/revoke:
    post:
      tags: [API Keys]
      operationId: revokeApiKey
      security: [{ ConsoleToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - {
            name: keyId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "200": { description: API key irrevocably revoked } }
  /api/admin/agents/{slug}:
    parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
    get:
      tags: [Agents]
      operationId: getAgent
      security: [{ ConsoleToken: [] }]
      responses:
        { "200": { description: Logical Agent detail and current Card } }
    patch:
      tags: [Agents]
      operationId: updateAgent
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Agent policy and metadata updated } }
    delete:
      tags: [Agents]
      operationId: deleteAgent
      security: [{ ConsoleToken: [] }]
      responses: { "204": { description: Agent soft-deleted } }
  /api/admin/agents/{slug}/status:
    post:
      tags: [Agents]
      operationId: changeAgentStatus
      security: [{ ConsoleToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
      responses:
        {
          "200":
            {
              description: Platform traffic enabled or disabled; remote processes are not stopped,
            },
        }
  /api/admin/agents/{slug}/refresh-card:
    post:
      tags: [Agents]
      operationId: refreshAgentCard
      security: [{ ConsoleToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
      responses:
        { "200": { description: Card revalidated with a capability diff } }
  /api/admin/agents/{slug}/card-revisions:
    get:
      tags: [Agents]
      operationId: listAgentCardRevisions
      security: [{ ConsoleToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
      responses:
        { "200": { description: Card history and capability differences } }
  /api/admin/agents/{slug}/instances/{instanceId}:
    parameters:
      - { $ref: "#/components/parameters/AgentSlug" }
      - {
          name: instanceId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      tags: [Agents]
      operationId: updateAgentInstance
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            {
              description: "Instance routing, state, Card URL or encrypted credential updated",
            },
        }
    delete:
      tags: [Agents]
      operationId: deleteAgentInstance
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "204":
            {
              description: Instance deleted when no active task lease requires it,
            },
        }
  /api/admin/agents/{slug}/instances/{instanceId}/health-check:
    post:
      tags: [Agents]
      operationId: checkAgentInstanceHealth
      security: [{ ConsoleToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/AgentSlug" }
        - {
            name: instanceId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        { "200": { description: Parent-scoped instance health check result } }
  /api/admin/agents/{slug}/health:
    get:
      tags: [Agents]
      operationId: listAgentHealthHistory
      security: [{ ConsoleToken: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
      responses:
        { "200": { description: Logical and per-instance health history } }
  /api/admin/tasks/{taskId}/events.json:
    get:
      tags: [Tasks]
      operationId: downloadTaskEvents
      security: [{ ConsoleToken: [] }]
      parameters:
        [{ name: taskId, in: path, required: true, schema: { type: integer } }]
      responses: { "200": { description: Downloadable event timeline JSON } }
  /api/admin/usage/export.csv:
    get:
      tags: [Usage]
      operationId: exportUsageCsv
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            {
              description: Filtered usage export,
              content: { text/csv: { schema: { type: string } } },
            },
        }
  /api/admin/tenants/{tenantId}/webhooks:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            { description: Tenant Webhook endpoints without signing secrets },
        }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "201": { description: Webhook created; signing secret returned once },
        }
  /api/admin/tenants/{tenantId}/webhooks/{webhookId}:
    parameters:
      - { $ref: "#/components/parameters/TenantId" }
      - {
          name: webhookId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      tags: [Webhooks]
      operationId: getWebhook
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Webhook metadata } }
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Webhook configuration updated } }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      security: [{ ConsoleToken: [] }]
      responses: { "204": { description: Webhook soft-deleted } }
  /api/admin/tenants/{tenantId}/webhooks/{webhookId}/rotate-secret:
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      security: [{ ConsoleToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - {
            name: webhookId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses: { "200": { description: New signing secret returned once } }
  /api/admin/tenants/{tenantId}/webhooks/{webhookId}/deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      security: [{ ConsoleToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/TenantId" }
        - {
            name: webhookId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
      responses:
        {
          "200":
            {
              description: "Attempts, HTTP results, retry schedule and dead letters",
            },
        }
  /api/admin/tenants/{tenantId}/notification-channels:
    parameters: [{ $ref: "#/components/parameters/TenantId" }]
    get:
      tags: [Notifications]
      operationId: listNotificationChannels
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            { description: Email and signed Webhook notification channels },
        }
    post:
      tags: [Notifications]
      operationId: createNotificationChannel
      security: [{ ConsoleToken: [] }]
      responses: { "201": { description: Notification channel created } }
  /api/admin/alerts/rules:
    get:
      tags: [Alerts]
      operationId: listAlertRules
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Tenant-visible alert rules } }
    post:
      tags: [Alerts]
      operationId: createAlertRule
      security: [{ ConsoleToken: [] }]
      responses: { "201": { description: Alert rule created } }
  /api/admin/alerts/rules/{ruleId}:
    parameters:
      [
        {
          name: ruleId,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        },
      ]
    get:
      tags: [Alerts]
      operationId: getAlertRule
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Alert rule detail } }
    patch:
      tags: [Alerts]
      operationId: updateAlertRule
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Alert rule updated } }
    delete:
      tags: [Alerts]
      operationId: deleteAlertRule
      security: [{ ConsoleToken: [] }]
      responses: { "204": { description: Alert rule deleted } }
  /api/admin/alerts/events:
    get:
      tags: [Alerts]
      operationId: listAlertEvents
      security: [{ ConsoleToken: [] }]
      responses:
        "200":
          {
            description: "Triggered, recovered, acknowledged and silenced alerts",
          }
  /api/admin/alerts/events/{eventId}/acknowledge:
    post:
      tags: [Alerts]
      operationId: acknowledgeAlert
      security: [{ ConsoleToken: [] }]
      parameters:
        [
          {
            name: eventId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses: { "200": { description: Alert acknowledged } }
  /api/admin/alerts/events/{eventId}/silence:
    post:
      tags: [Alerts]
      operationId: silenceAlert
      security: [{ ConsoleToken: [] }]
      parameters:
        [
          {
            name: eventId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        { "200": { description: Alert silenced until the requested time } }
  /api/admin/audit:
    get:
      tags: [Tenants]
      operationId: searchAuditLog
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            { description: Tenant-isolated immutable operation audit records },
        }
  /api/admin/settings:
    get:
      tags: [Authentication]
      operationId: listPlatformSettings
      security: [{ ConsoleToken: [] }]
      responses:
        {
          "200":
            { description: Effective runtime settings and source metadata },
        }
  /api/admin/settings/{key}:
    parameters:
      [{ name: key, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Authentication]
      operationId: getPlatformSetting
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Effective runtime setting } }
    put:
      tags: [Authentication]
      operationId: updatePlatformSetting
      security: [{ ConsoleToken: [] }]
      responses: { "200": { description: Runtime setting updated } }
  /v1/agents:
    get:
      tags: [A2A Gateway]
      operationId: externalAgentCatalog
      security: [{ TenantApiKey: [] }]
      responses:
        "200": { description: Agents visible to this API Key }
        "401": { $ref: "#/components/responses/Error" }
  /api/catalog/agents:
    get:
      tags: [Agents]
      operationId: authenticatedAgentCatalog
      security: [{ ConsoleToken: [] }]
      description: Returns public Agents plus Agents owned by or granted to the caller's active tenant memberships. Upstream addresses are always replaced with platform proxy addresses.
      parameters:
        - { name: tenantId, in: query, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [draft, offline, online, degraded] },
          }
      responses:
        "200":
          description: "Safe, permission-filtered Agent catalog"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogAgentPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/usage:
    get:
      tags: [A2A Gateway]
      operationId: externalUsage
      security: [{ TenantApiKey: [] }]
