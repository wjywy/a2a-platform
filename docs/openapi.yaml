    delete:
      tags: [A2A Gateway]
      operationId: deleteTaskPushNotificationConfig
      security: [{ TenantApiKey: [] }]
      responses:
        { "204": { description: Push notification configuration removed } }
components:
  securitySchemes:
    ConsoleToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
    TenantApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    TenantId:
      {
        name: tenantId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    AgentSlug:
      {
        name: slug,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[a-z0-9-]{3,64}$" },
      }
    InvitationToken:
      {
        name: token,
        in: path,
        required: true,
        schema: { type: string, minLength: 16 },
      }
    Page:
      {
        name: page,
        in: query,
        schema: { type: integer, minimum: 1, default: 1 },
      }
    PageSize:
      {
        name: pageSize,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
      }
  responses:
    AuthSession:
      description: Authenticated session; refresh token is an HttpOnly cookie
      headers:
        Set-Cookie: { schema: { type: string } }
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              accessTokenExpiresIn: { type: integer }
              refreshTokenExpiresAt: { type: string, format: date-time }
              user: { $ref: "#/components/schemas/User" }
    Error:
      description: Structured platform error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuotaError:
      description: Tenant, API Key, Agent or concurrent quota exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    AuthConfig:
      type: object
      required: [localLoginEnabled, selfRegistrationEnabled, oidcEnabled]
      properties:
        localLoginEnabled: { type: boolean }
        selfRegistrationEnabled: { type: boolean }
        oidcEnabled: { type: boolean }
        issuer: { type: string, format: uri }
    User:
      type: object
      required: [id, email, displayName, status, emailVerified]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        platformRole: { type: string, enum: [platform_admin] }
        status: { type: string, enum: [active, disabled] }
        emailVerified: { type: boolean }
    TenantRole:
      type: string
      enum: [tenant_admin, developer, viewer]
    Tenant:
      type: object
      required: [id, slug, displayName, status]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        displayName: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, suspended] }
        role: { $ref: "#/components/schemas/TenantRole" }
        minuteRequestLimit: { type: integer }
        dailyRequestLimit: { type: integer }
        monthlyRequestLimit: { type: integer }
        concurrentRequestLimit: { type: integer }
        dataRetentionDays: { type: integer, minimum: 7, maximum: 3650 }
    TenantInput:
      type: object
      properties:
        slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        displayName: { type: string, minLength: 2 }
        description: { type: string }
        minuteRequestLimit: { type: integer, minimum: 1 }
        dailyRequestLimit: { type: integer, minimum: 1 }
        monthlyRequestLimit: { type: integer, minimum: 1 }
        concurrentRequestLimit: { type: integer, minimum: 1 }
        warningThresholdPercent: { type: integer, minimum: 1, maximum: 100 }
        dataRetentionDays: { type: integer, minimum: 7, maximum: 3650 }
    ApiKeyInput:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 2 }
        description: { type: string }
        scopes:
          type: array
          minItems: 1
          items: { enum: [agent:invoke, task:read, task:cancel, usage:read] }
        agentIds: { type: array, items: { type: string, format: uuid } }
        expiresAt: { type: [string, "null"], format: date-time }
        minuteRequestLimit: { type: [integer, "null"], minimum: 1 }
        dailyRequestLimit: { type: [integer, "null"], minimum: 1 }
        monthlyRequestLimit: { type: [integer, "null"], minimum: 1 }
        concurrentRequestLimit: { type: [integer, "null"], minimum: 1 }
    AgentInput:
      type: object
      required: [slug, displayName, cardUrl, tenantId]
      properties:
        slug: { type: string, pattern: "^[a-z0-9-]{3,64}$" }
        displayName: { type: string, minLength: 2 }
        cardUrl: { type: string, format: uri }
        tenantId: { type: string, format: uuid }
        labels: { type: array, maxItems: 8, items: { type: string } }
        visibility: { enum: [private, tenant, public] }
        routingStrategy:
          { enum: [weighted_round_robin, least_connections, priority] }
    CatalogAgent:
      type: object
      required:
        - id
        - slug
        - displayName
        - description
        - cardUrl
        - status
        - healthStatus
        - labels
        - visibility
        - allowedTenantIds
        - invocationPolicy
        - routingStrategy
        - selectedInterface
        - version
        - createdAt
        - updatedAt
        - access
        - manageable
        - administrable
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        displayName: { type: string }
        description: { type: string }
        cardUrl: { type: string, format: uri }
        status: { enum: [draft, offline, online, degraded] }
        healthStatus: { enum: [unknown, healthy, unhealthy] }
        labels: { type: array, items: { type: string } }
        tenantId: { type: string, format: uuid }
        visibility: { enum: [private, tenant, public] }
        allowedTenantIds:
          description: Always empty in catalog responses; authorization grants are not exposed.
          type: array
          maxItems: 0
          items: { type: string, format: uuid }
        invocationPolicy:
          type: object
          required: [timeoutMs, maxRetries, maxConcurrent]
          properties:
            timeoutMs: { type: integer }
            maxRetries: { type: integer }
            maxConcurrent: { type: integer }
        routingStrategy:
          { enum: [weighted_round_robin, least_connections, priority] }
        selectedInterface:
          type: object
          required: [url, protocolBinding, protocolVersion]
          properties:
            url: { type: string, format: uri }
            protocolBinding: { const: HTTP+JSON }
            protocolVersion: { const: "1.0" }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        access: { enum: [public, tenant_owner, tenant_grant, platform_admin] }
        manageable: { type: boolean }
        administrable: { type: boolean }
    CatalogAgentPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogAgent" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 1 }
    AgentInstanceInput:
      type: object
      required: [name, cardUrl]
      properties:
        name: { type: string }
        cardUrl: { type: string, format: uri }
        weight: { type: integer, minimum: 1, maximum: 10000 }
        priority: { type: integer, minimum: 0, maximum: 10000 }
        status: { enum: [active, draining, disabled] }
        credential:
          oneOf:
            - { type: object, properties: { type: { const: none } } }
            - {
                type: object,
                properties:
                  {
                    type: { const: bearer },
                    token: { type: string, writeOnly: true },
                  },
              }
            - {
                type: object,
                properties:
                  {
                    type: { const: api_key },
                    headerName: { type: string },
                    value: { type: string, writeOnly: true },
                  },
              }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }
        requestId: { type: string }
