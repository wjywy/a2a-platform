  /agents/{slug}/a2a/rest/message:stream:
    post:
      tags: [A2A Gateway]
      operationId: streamMessage
      security: [{ TenantApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
      responses:
        "200":
          description: A2A Server-Sent Event stream
