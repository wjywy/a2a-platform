  /agents/{slug}/a2a/rest/tasks/{taskId}:
    get:
      tags: [A2A Gateway]
      operationId: getTask
      security: [{ TenantApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/AgentSlug" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        {
          "200": { description: Task read from its bound upstream instance },
          "404": { $ref: "#/components/responses/Error" },
        }
  /agents/{slug}/a2a/rest/tasks/{taskId}:cancel:
    post:
      tags: [A2A Gateway]
      operationId: cancelTask
      security: [{ TenantApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/AgentSlug" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        {
          "200":
            { description: Cancellation forwarded to the Task-bound instance },
        }
  /agents/{slug}/a2a/rest/tasks/{taskId}:subscribe:
    get:
      tags: [A2A Gateway]
      operationId: subscribeTask
      security: [{ TenantApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/AgentSlug" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        {
          "200":
            {
              description: Task SSE stream from its bound instance,
              content: { text/event-stream: { schema: { type: string } } },
            },
        }
    post:
      tags: [A2A Gateway]
      operationId: subscribeTaskPost
      security: [{ TenantApiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/AgentSlug" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        { "200": { description: POST-compatible Task SSE subscription } }
  /agents/{slug}/a2a/jsonrpc:
    post:
      tags: [A2A Gateway]
      operationId: jsonRpc
      security: [{ TenantApiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/AgentSlug" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, id, method]
              properties:
                jsonrpc: { const: "2.0" }
                id: { oneOf: [{ type: string }, { type: integer }] }
                method:
                  enum:
                    [
                      GetExtendedAgentCard,
                      SendMessage,
                      SendStreamingMessage,
                      GetTask,
                      ListTasks,
                      CancelTask,
                      SubscribeToTask,
                      CreateTaskPushNotificationConfig,
                      GetTaskPushNotificationConfig,
                      ListTaskPushNotificationConfigs,
                      DeleteTaskPushNotificationConfig,
                    ]
                params: { type: object, additionalProperties: true }
      responses:
        "200":
          { description: JSON-RPC result or SSE stream for streaming methods }
