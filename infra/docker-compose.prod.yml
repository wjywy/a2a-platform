services:
  api:
    environment:
      NODE_ENV: production
      PLATFORM_ORIGIN: https://a2a-platform.com
      CONSOLE_ORIGINS: https://a2a-platform.com,https://www.a2a-platform.com
      CONSOLE_PUBLIC_ORIGIN: https://a2a-platform.com
      OIDC_REDIRECT_URI: https://a2a-platform.com/api/auth/oidc/callback
      PLATFORM_DEV_TOKEN: ""
      LOCAL_LOGIN_ENABLED: "true"
      SELF_REGISTRATION_ENABLED: "true"
      ALLOW_PRIVATE_OUTBOUND_TARGETS: "false"
  worker:
    environment:
      NODE_ENV: production
      # The worker has its own process environment; it must use the same
      # public origin as API when checking the public built-in Agent Cards.
      PLATFORM_ORIGIN: https://a2a-platform.com
      ALLOW_PRIVATE_OUTBOUND_TARGETS: "false"
