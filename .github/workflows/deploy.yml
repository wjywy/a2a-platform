name: CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: a2a_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d a2a_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://platform:platform@localhost:5432/a2a_platform
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run migrate
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build release images on the runner
        run: |
          # The production instance has 1.8 GiB RAM and no swap. Building
          # Node images there OOM-killed Postgres and the API, so build on the
          # GitHub runner and transfer the tagged images over the existing SSH
          # deployment channel instead.
          docker compose -f infra/docker-compose.yml build
          docker save \
            -o "$RUNNER_TEMP/a2a-platform-images.tar" \
            infra-api infra-migrate infra-worker infra-console

      - name: Transfer release images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp "$RUNNER_TEMP/a2a-platform-images.tar" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/a2a-platform-images.tar"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: |
          # Encode optional model credentials before handing them to SSH. The
          # remote script only updates .env when a non-empty repository secret
          # exists, so a missing secret cannot erase a working production key.
          deepseek_api_key_b64="$(printf '%s' "$DEEPSEEK_API_KEY" | base64 -w 0)"
          deepseek_model_b64="$(printf '%s' "$DEEPSEEK_MODEL" | base64 -w 0)"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEEPSEEK_API_KEY_B64=$deepseek_api_key_b64 DEEPSEEK_MODEL_B64=$deepseek_model_b64 bash -se" <<'REMOTE'
            set -euo pipefail
            app_dir="$HOME/apps/a2a-platform"
            update_env_value() {
              local key="$1"
              local value="$2"
              local temp_env
              temp_env="$(mktemp .env.XXXXXX)"
              chmod 600 "$temp_env"
              awk -v target_key="$key" -v target_value="$value" '
                index($0, target_key "=") == 1 {
                  if (!updated) {
                    print target_key "=" target_value
                    updated = 1
                  }
                  next
                }
                { print }
                END {
                  if (!updated) print target_key "=" target_value
                }
              ' .env > "$temp_env"
              mv "$temp_env" .env
            }
            diagnose_deploy_failure() {
              local status=$?
              echo "::error::Remote deployment failed; collecting container diagnostics."
              cd "$app_dir" || exit "$status"
              sudo docker compose --env-file .env \
                -f infra/docker-compose.yml \
                -f infra/docker-compose.prod.yml ps || true
              sudo docker compose --env-file .env \
                -f infra/docker-compose.yml \
                -f infra/docker-compose.prod.yml \
                logs --tail=180 migrate api nginx worker || true
              exit "$status"
            }
            trap diagnose_deploy_failure ERR
            cd "$app_dir"
            if [ -n "${DEEPSEEK_API_KEY_B64:-}" ]; then
              update_env_value \
                DEEPSEEK_API_KEY \
                "$(printf '%s' "$DEEPSEEK_API_KEY_B64" | base64 --decode)"
            fi
            if [ -n "${DEEPSEEK_MODEL_B64:-}" ]; then
              update_env_value \
                DEEPSEEK_MODEL \
                "$(printf '%s' "$DEEPSEEK_MODEL_B64" | base64 --decode)"
            fi
            git pull --ff-only origin main
            sudo docker load -i /tmp/a2a-platform-images.tar
            sudo docker compose --env-file .env \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml \
              up -d --no-build --remove-orphans
            # Caddy is deliberately host-networked so it can terminate TLS on
            # 80/443. Reload its versioned route configuration after the app
            # containers are healthy; this exposes health and A2A paths while
            # leaving the console as the default route.
            install -d -m 700 "$HOME/caddy"
            install -m 600 infra/Caddyfile "$HOME/caddy/Caddyfile"
            # The container's default command reads this bind-mounted file on
            # startup. Restarting is deliberately used instead of Caddy's
            # admin reload so a stale in-memory configuration cannot survive a
            # successful deployment.
            sudo docker restart caddy >/dev/null
            sleep 3
            curl -kfsS --resolve a2a-platform.com:443:127.0.0.1 \
              https://a2a-platform.com/healthz >/dev/null
            sudo docker compose --env-file .env \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml ps
          REMOTE
