name: CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: a2a_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d a2a_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgres://platform:platform@localhost:5432/a2a_platform
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run migrate
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine release payload
        id: release_payload
        run: |
          # Workflow-only changes (such as rotating or adding optional runtime
          # configuration) can safely reuse the image already on the server.
          # Application, infrastructure, or dependency changes still publish
          # a fresh image set from the GitHub runner.
          if [ "${{ github.event_name }}" = "push" ] \
            && git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- \
              . ':(exclude).github/workflows/deploy.yml'; then
            echo "images=false" >> "$GITHUB_OUTPUT"
          else
            echo "images=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Build release images on the runner
        if: steps.release_payload.outputs.images == 'true'
        run: |
          # The production instance has 1.8 GiB RAM and no swap. Building
          # Node images there OOM-killed Postgres and the API, so build on the
          # GitHub runner and transfer the tagged images over the existing SSH
          # deployment channel instead.
          docker compose -f infra/docker-compose.yml build
          # docker save emits uncompressed layer tars. Compressing them on the
          # runner keeps a constrained production link from spending many
          # minutes transferring duplicate Node and OS filesystem contents.
          docker save \
            infra-api infra-migrate infra-worker infra-console \
            | gzip -1 > "$RUNNER_TEMP/a2a-platform-images.tar.gz"
          du -h "$RUNNER_TEMP/a2a-platform-images.tar.gz"

      - name: Transfer release images
        if: steps.release_payload.outputs.images == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # A failed TCP stream used to leave scp blocked indefinitely, which
          # in turn held the production deployment concurrency lock forever.
          # Keep the transfer observable and fail it deterministically so a
          # later push can recover the release pipeline.
          timeout --preserve-status 12m scp \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "$RUNNER_TEMP/a2a-platform-images.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/a2a-platform-images.tar.gz"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          RELEASE_IMAGES: ${{ steps.release_payload.outputs.images }}
        run: |
          # Encode optional model credentials before handing them to SSH. The
          # remote script only updates .env when a non-empty repository secret
          # exists, so a missing secret cannot erase a working production key.
          deepseek_api_key_b64="$(printf '%s' "$DEEPSEEK_API_KEY" | base64 -w 0)"
          deepseek_model_b64="$(printf '%s' "$DEEPSEEK_MODEL" | base64 -w 0)"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEEPSEEK_API_KEY_B64=$deepseek_api_key_b64 DEEPSEEK_MODEL_B64=$deepseek_model_b64 RELEASE_IMAGES=$RELEASE_IMAGES bash -se" <<'REMOTE'
            set -euo pipefail
            app_dir="$HOME/apps/a2a-platform"
            update_env_value() {
              local key="$1"
              local value="$2"
              local temp_env
              temp_env="$(mktemp .env.XXXXXX)"
              chmod 600 "$temp_env"
              awk -v target_key="$key" -v target_value="$value" '
                index($0, target_key "=") == 1 {
                  if (!updated) {
                    print target_key "=" target_value
                    updated = 1
                  }
                  next
                }
                { print }
                END {
                  if (!updated) print target_key "=" target_value
                }
              ' .env > "$temp_env"
              mv "$temp_env" .env
            }
            diagnose_deploy_failure() {
              local status=$?
              echo "::error::Remote deployment failed; collecting container diagnostics."
              cd "$app_dir" || exit "$status"
              sudo docker compose --env-file .env \
                -f infra/docker-compose.yml \
                -f infra/docker-compose.prod.yml ps || true
              sudo docker compose --env-file .env \
                -f infra/docker-compose.yml \
                -f infra/docker-compose.prod.yml \
                logs --tail=180 migrate api nginx worker || true
              exit "$status"
            }
            trap diagnose_deploy_failure ERR
            cd "$app_dir"
            if [ -n "${DEEPSEEK_API_KEY_B64:-}" ]; then
              update_env_value \
                DEEPSEEK_API_KEY \
                "$(printf '%s' "$DEEPSEEK_API_KEY_B64" | base64 --decode)"
            fi
            if [ -n "${DEEPSEEK_MODEL_B64:-}" ]; then
              update_env_value \
                DEEPSEEK_MODEL \
                "$(printf '%s' "$DEEPSEEK_MODEL_B64" | base64 --decode)"
            fi
            git pull --ff-only origin main
            if [ "${RELEASE_IMAGES:-true}" = "true" ]; then
              gzip --decompress --stdout /tmp/a2a-platform-images.tar.gz | sudo docker load
              rm -f /tmp/a2a-platform-images.tar.gz
            else
              # Clear interrupted transfer payloads before reusing the already
              # deployed image set for a configuration-only release.
              rm -f /tmp/a2a-platform-images.tar /tmp/a2a-platform-images.tar.gz
            fi
            sudo docker compose --env-file .env \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml \
              up -d --no-build --remove-orphans
            # Caddy is deliberately host-networked so it can terminate TLS on
            # 80/443. Reload its versioned route configuration after the app
            # containers are healthy; this exposes health and A2A paths while
            # leaving the console as the default route.
            install -d -m 700 "$HOME/caddy"
            install -m 600 infra/Caddyfile "$HOME/caddy/Caddyfile"
            # The container's default command reads this bind-mounted file on
            # startup. Restarting is deliberately used instead of Caddy's
            # admin reload so a stale in-memory configuration cannot survive a
            # successful deployment.
            sudo docker restart caddy >/dev/null
            sleep 3
            curl -kfsS --resolve a2a-platform.com:443:127.0.0.1 \
              https://a2a-platform.com/healthz >/dev/null
            sudo docker compose --env-file .env \
              -f infra/docker-compose.yml \
              -f infra/docker-compose.prod.yml ps
          REMOTE

      - name: Verify DeepSeek production credential
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Validate only that the server has a non-empty credential. Never
          # print the value or pass it through the GitHub Actions log.
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd "$HOME/apps/a2a-platform"
            if ! grep -Eq '^DEEPSEEK_API_KEY=.+$' .env; then
              echo '::error::Production DEEPSEEK_API_KEY is missing or empty.'
              exit 1
            fi
          REMOTE

      - name: Smoke test built-in Agent with real model
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Run through the production A2A boundary with the server-only
          # token and an active tenant. This proves the provider request and
          # final answer path rather than merely checking configuration.
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            app_dir="$HOME/apps/a2a-platform"
            cd "$app_dir"
            symbol_token="$(sed -n 's/^SYMBOL_INTERNAL_TOKEN=//p' .env | head -n 1)"
            test -n "$symbol_token"
            tenant_id="$(sudo docker compose --env-file .env \
              -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
              exec -T postgres psql -U platform -d a2a_platform -Atc \
              "SELECT id FROM tenants WHERE slug='default' AND status='active' LIMIT 1;")"
            test -n "$tenant_id"
            message_id="$(cat /proc/sys/kernel/random/uuid)"
            response="$(curl --fail --silent --show-error --max-time 90 \
              -H "authorization: Bearer $symbol_token" \
              -H 'content-type: application/json' \
              --data "{\"message\":{\"messageId\":\"$message_id\",\"role\":\"ROLE_USER\",\"parts\":[{\"text\":\"请分析 AAPL 的短线风险，并用中文简洁回答。\"}]}}" \
              "http://127.0.0.1:8080/api/builtin/symbol/symbol-market/$tenant_id/message:send")"
            printf '%s' "$response" | grep -q '"state":"TASK_STATE_COMPLETED"'
            if printf '%s' "$response" | grep -Fq 'AI 回复服务未配置'; then
              echo '::error::Built-in Agent reported an unconfigured AI response service.'
              exit 1
            fi
            echo 'Built-in Agent real-model smoke test passed.'
          REMOTE
